[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "household-purchases"
version = "0.1.0"
description = "Private, reconciled household delivery-summary analytics"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "SQLAlchemy>=2.0.36,<3", "alembic>=1.14,<2", "psycopg>=3.2,<4", "beautifulsoup4>=4.12,<5", "httpx>=0.28,<1"]

[project.scripts]
household-purchases = "household_purchases.cli:main"

[dependency-groups]
dev = ["psycopg-binary>=3.2,<4", "pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "household_purchases/migrations"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
